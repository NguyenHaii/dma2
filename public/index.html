<!-- public/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login Page</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
  <h2 class="text-center">Login</h2>
  <form id="loginForm">
    <div class="mb-3">
      <label>Username</label>
      <input type="text" name="username" class="form-control" required />
    </div>
    <div class="mb-3">
      <label>Password</label>
      <input type="password" name="password" class="form-control" required />
    </div>
    <button type="submit" class="btn btn-primary">Login</button>
    <button type="button" class="btn btn-link" data-bs-toggle="modal" data-bs-target="#registerModal">Đăng ký</button>
  </form>
  <div id="loginMsg" class="mt-3 text-danger"></div>
</div>

<!-- Modal Đăng Ký -->
<div class="modal fade" id="registerModal" tabindex="-1">
  <div class="modal-dialog">
    <form class="modal-content" id="registerForm">
      <div class="modal-header">
        <h5 class="modal-title">Đăng ký</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-2">
          <label>Username</label>
          <input type="text" name="username" class="form-control" required />
        </div>
        <div class="mb-2">
          <label>Password</label>
          <input type="password" name="password" class="form-control" required />
        </div>
        <div class="mb-2">
          <label>Phone (VN format: +84...)</label>
          <input type="text" name="phone" class="form-control" required />
        </div>
      </div>
      <div class="modal-footer">
        <button type="submit" class="btn btn-success">Đăng ký</button>
      </div>
    </form>
  </div>
</div>

<script>
  const loginForm = document.getElementById("loginForm");
  const registerForm = document.getElementById("registerForm");

  loginForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const formData = new FormData(loginForm);
    const res = await fetch("/login", {
      method: "POST",
      body: new URLSearchParams(formData),
    });
    const data = await res.json();
    document.getElementById("loginMsg").innerText = data.message;
    if (data.success) alert("Đăng nhập thành công!");
  });

  registerForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const formData = new FormData(registerForm);
    const res = await fetch("/register", {
      method: "POST",
      body: new URLSearchParams(formData),
    });
    const data = await res.json();
    alert(data.message);
  });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
